<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500&family=Fredoka+One&family=Indie+Flower&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="manifest" href="site.webmanifest">
  <title>Bulls and Cows – Play</title>
</head>
<body>
  <main class="screen game">

    <header class="game-header">
      <a class="back" href="index.html" aria-label="Back to home">←</a>
      <img class="icongame" src="bull.jpg" alt="Bull">
      <h1 class="hand game-title">Bulls and Cows</h1>
      <img class="icongame" src="cow.jpg" alt="Cow">
    </header>
    <hr class="rule-line header-line">

    <div class="hand intro">
      <p>I have thought of a 4-digit number</p>
      <p>What's your guess? :)</p>
    </div>
    <p class="reminder">Remember: No repeated digits allowed</p>

  <!-- rows are added here by the script -->

        <div class="giveup-wrap" id="giveup-wrap">
      <button class="giveup" id="giveup" type="button">Give Up</button>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
  </main>
  </body>
  </html>
